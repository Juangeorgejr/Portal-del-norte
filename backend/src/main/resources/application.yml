server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: hotel-portal-del-norte
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: America/Bogota
    serialization:
      write-dates-as-timestamps: false

# Configuración JWT
jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXN1cGVyLXNlY3JldC1qd3Qta2V5LWZvci1ob3RlbC1wb3J0YWwtZGVsLW5vcnRlLTIwMjY=}
  access-token-expiration-ms: 900000 # 15 minutos
  refresh-token-expiration-ms: 604800000 # 7 días

# Configuración de Hotel Portal del Norte
hotel:
  name: "Hotel Portal del Norte"
  tax:
    iva-rate: 0.19 # 19% IVA Colombia
  cancellation:
    free-cancellation-hours: 48
    penalty-percent: 50.0

# Documentación Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
